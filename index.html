```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Security Checker</title>

    <style>
        body {
            background: #0b1120;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #172033;
            padding: 35px;
            border-radius: 16px;
            width: 340px;
            max-width: calc(100% - 70px);
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 25px;
        }

        p {
            color: #cbd5e1;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0b1120;
            color: white;
            font-size: 16px;
        }

        .bar {
            height: 8px;
            background: #334155;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 18px;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: #ef4444;
            transition: width 0.3s;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        #score {
            color: #94a3b8;
        }

        .note {
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛡️ Password Checker</h1>
        <p>Check the strength of your password.</p>

        <input
            type="password"
            id="password"
            placeholder="Enter a password"
            autocomplete="off"
        >

        <div class="bar">
            <div id="progress"></div>
        </div>

        <div id="result">Enter a password</div>
        <p id="score">Security score: 0/5</p>

        <p class="note">
            Educational project. Passwords are checked locally
            in your browser and are not sent to a server.
        </p>
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const result = document.getElementById("result");
        const scoreText = document.getElementById("score");
        const progress = document.getElementById("progress");

        passwordInput.addEventListener("input", function () {
            const password = passwordInput.value;
            let score = 0;

            if (password.length >= 8) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            scoreText.textContent = `Security score: ${score}/5`;
            progress.style.width = `${score * 20}%`;

            if (password.length === 0) {
                result.textContent = "Enter a password";
                progress.style.background = "#334155";
            } else if (score <= 2) {
                result.textContent = "🔴 Weak password";
                progress.style.background = "#ef4444";
            } else if (score <= 4) {
                result.textContent = "🟡 Medium password";
                progress.style.background = "#eab308";
            } else {
                result.textContent = "🟢 Strong password";
                progress.style.background = "#22c55e";
            }
        });
    </script>
</body>
</html>
